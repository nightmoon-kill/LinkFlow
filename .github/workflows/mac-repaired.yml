name: Build and test repaired Mac Universal DMG
on:
  push:
    branches: [build/v1.0.4-mac-universal]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build Universal application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:mac-universal -- --dir --publish never -c.extraMetadata.version=1.0.4
      - name: Sign merged application and verify
        run: |
          mkdir -p build
          cat > build/local-entitlements.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>com.apple.security.cs.allow-jit</key><true/>
          <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
          <key>com.apple.security.cs.disable-library-validation</key><true/>
          </dict></plist>
          PLIST
          app_path="dist/mac-universal/LinkFlow.app"
          echo "Signature before repair:"
          codesign --verify --deep --strict --verbose=2 "$app_path" || true
          codesign --force --deep --sign - --options runtime --entitlements build/local-entitlements.plist "$app_path"
          codesign --verify --deep --strict --all-architectures --verbose=2 "$app_path"
          lipo "$app_path/Contents/MacOS/LinkFlow" -verify_arch x86_64 arm64
          lipo "$app_path/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework" -verify_arch x86_64 arm64
      - name: Create drag-to-Applications DMG
        run: |
          mkdir -p dist/dmg-root
          ditto dist/mac-universal/LinkFlow.app dist/dmg-root/LinkFlow.app
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname "LinkFlow 1.0.4" -srcfolder dist/dmg-root -fs HFS+ -format UDZO -imagekey zlib-level=9 dist/LinkFlow-1.0.4-mac-universal.dmg
          hdiutil verify dist/LinkFlow-1.0.4-mac-universal.dmg
          shasum -a 256 dist/LinkFlow-1.0.4-mac-universal.dmg > dist/LinkFlow-1.0.4-mac-universal.dmg.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LinkFlow-1.0.4-mac-universal
          path: |
            dist/LinkFlow-1.0.4-mac-universal.dmg
            dist/LinkFlow-1.0.4-mac-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 30
  install-and-launch:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: LinkFlow-1.0.4-mac-universal
          path: package
      - name: Mount DMG, install application, verify signature
        run: |
          mkdir -p "$RUNNER_TEMP/linkflow-volume" "$RUNNER_TEMP/linkflow-installed"
          hdiutil attach package/LinkFlow-1.0.4-mac-universal.dmg -readonly -nobrowse -mountpoint "$RUNNER_TEMP/linkflow-volume"
          test -L "$RUNNER_TEMP/linkflow-volume/Applications"
          ditto "$RUNNER_TEMP/linkflow-volume/LinkFlow.app" "$RUNNER_TEMP/linkflow-installed/LinkFlow.app"
          hdiutil detach "$RUNNER_TEMP/linkflow-volume"
          codesign --verify --deep --strict --all-architectures --verbose=2 "$RUNNER_TEMP/linkflow-installed/LinkFlow.app"
      - run: npm install --no-save --ignore-scripts playwright-core
      - name: Launch installed app and verify native architecture and theme
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          "$RUNNER_TEMP/linkflow-installed/LinkFlow.app/Contents/MacOS/LinkFlow" --remote-debugging-port=9222 > "$RUNNER_TEMP/linkflow-launch.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/linkflow-launch.log"' EXIT
          for attempt in {1..45}; do
            if curl -sf http://127.0.0.1:9222/json/version > /dev/null; then break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          node <<'JS'
          const { chromium } = require('playwright-core');
          (async () => {
            const browser = await chromium.connectOverCDP('http://127.0.0.1:9222');
            const page = browser.contexts()[0].pages()[0];
            await page.waitForSelector('#searchInput');
            const arch = await page.evaluate(() => process.arch);
            if (arch !== process.env.EXPECTED_ARCH) throw Error('Wrong native architecture: ' + arch);
            const result = await page.evaluate(() => {
              const fields = ['keywordInput','urlInput','titleInput','searchInput'];
              fields.forEach(id => { document.getElementById(id).style.transition = 'none'; });
              const read = () => fields.map(id => getComputedStyle(document.getElementById(id)).color);
              document.body.classList.remove('light-mode');
              const dark = read();
              document.body.classList.add('light-mode');
              const light = read();
              return {dark,light};
            });
            if (!result.dark.every(c => c === 'rgb(255, 255, 255)')) throw Error('Dark theme regression: '+JSON.stringify(result));
            if (!result.light.every(c => c === 'rgb(30, 41, 59)')) throw Error('Light theme regression: '+JSON.stringify(result));
            console.log('Installed application launched natively on '+arch+'; both theme colors passed.');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS
