<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkFlow | Keyword Link Manager</title>
    <meta name="description" content="A simple tool to manage and copy keyword hyperlinks.">
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <main class="dashboard">
            <header class="header">
                <div class="header-top">
                    <button id="themeToggle" class="icon-btn theme-toggle" title="Toggle Theme">
                        <i data-lucide="sun" style="width: 20px;"></i>
                    </button>
                </div>
                <div class="logo">
                    <div class="logo-icon">
                        <i data-lucide="link-2" style="color: white; width: 24px;"></i>
                    </div>
                    <span>LinkFlow</span>
                </div>
                <p style="color: var(--text-secondary); margin-top: 0.5rem;">Quickly manage and copy your keyword hyperlinks</p>
            </header>

            <section class="form-container">
                <form id="keywordForm" class="keyword-form-horizontal">
                    <input type="hidden" id="editIndex" value="-1">
                    <div class="input-group">
                        <input type="text" id="keywordInput" placeholder="Keyword" required>
                    </div>
                    <div class="input-group">
                        <input type="text" id="urlInput" placeholder="URL or Destination" required>
                    </div>
                    <div class="input-group">
                        <input type="text" id="titleInput" placeholder="Advisory Title (Tooltip)">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i data-lucide="plus" style="width: 18px;"></i>
                        Add
                    </button>
                </form>
            </section>

            <section class="list-container">
                <div class="list-header">
                    <div class="list-title-group">
                        <h2 class="section-title">My Save Keyword</h2>
                        <span id="keywordCount" style="color: var(--text-secondary); font-size: 0.8rem;">0 items</span>
                    </div>
                    <div class="data-actions">
                        <button id="exportBtn" class="btn btn-secondary btn-sm" title="Export to CSV">
                            <i data-lucide="download" style="width: 14px;"></i> Export
                        </button>
                        <button id="importBtn" class="btn btn-secondary btn-sm" title="Import from CSV">
                            <i data-lucide="upload" style="width: 14px;"></i> Import
                        </button>
                        <input type="file" id="csvFileInput" accept=".csv" style="display: none;">
                    </div>
                </div>
                
                <div class="search-container">
                    <div class="search-box">
                        <i data-lucide="search" style="width: 18px; color: var(--text-secondary);"></i>
                        <input type="text" id="searchInput" placeholder="Search keywords...">
                    </div>
                    <div class="sort-container">
                        <i data-lucide="list-filter" style="width: 16px; color: var(--text-secondary);"></i>
                        <select id="sortSelect" class="sort-select">
                            <option value="newest">Newest First</option>
                            <option value="alpha">A-Z (ก-ฮ)</option>
                        </select>
                    </div>
                </div>

                <div id="alphabetFilter" class="alphabet-filter">
                    <!-- Alphabet buttons will be injected here -->
                </div>

                <div id="keywordList" class="keyword-list-compact">
                    <!-- Keywords will be injected here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Custom Confirmation Modal -->
    <div id="deleteModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="warning-icon">
                    <i data-lucide="alert-triangle" style="color: var(--danger); width: 24px;"></i>
                </div>
                <h3>Delete Keyword?</h3>
            </div>
            <p>Are you sure you want to delete this keyword? This action cannot be undone.</p>
            <div class="modal-actions">
                <button id="cancelDelete" class="btn btn-secondary">Cancel</button>
                <button id="confirmDelete" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
